{% set name = "opentelemetry-exporter-otlp-common" %}
{% set version = "0.66b2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 06f5a9b88638e310efa1f1d206cdf6b75393e112aba4e174a963416192bd1028

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [py<310]
  # Skip compiling byte code to avoid extremely long paths in the conda package cache
  # Due to the nested structure of this package and the long build string, environments
  # can exceed the Windows path limit if installed into LOCALAPPDATA
  skip_compile_pyc:  # [win]
    - "*"            # [win]

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - opentelemetry-sdk >=1.45.2,<1.46.dev0
  run_constrained:
    - opentelemetry-exporter-http-transport ==0.66b2

test:
  source_files:
    - tests
  imports:
    - opentelemetry.exporter.otlp.common
  commands:
    - pip check
    - pytest -vv tests
  requires:
    - pip
    - pytest
    - opentelemetry-exporter-http-transport ==0.66b2
    - opentelemetry-api ==1.45.2
    - opentelemetry-sdk ==1.45.2
    - opentelemetry-semantic-conventions ==0.66b2

about:
  home: https://opentelemetry.io
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: OpenTelemetry OTLP HTTP export utilities
  description: This package is intended to be used by OpenTelemetry signal exporters (traces, metrics, logs) that send telemetry with OTLP. Currently, all functionality in this package is marked as internal and is not intended for use directly by application developers.
  doc_url: https://opentelemetry.io/docs
  dev_url: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp-common

extra:
  recipe-maintainers:
    - xhochy
